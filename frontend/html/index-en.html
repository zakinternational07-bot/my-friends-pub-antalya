<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16.png" />
  <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png" />
  <title>My Friends Pub Antalya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <div class="hero">
    <!-- Фон главной: постер виден сразу, видео подгружается после загрузки
         страницы и плавно проявляется поверх него (см. js/hero-video.js).
         Если видео не поддерживается, включена экономия трафика или
         пользователь просил меньше анимации — остаётся постер. -->
    <div class="hero-bg" style="background-image: url('../assets/images/hero-poster.webp');">
      <video class="hero-bg-video" id="hero-video"
             muted loop playsinline preload="none"
             aria-hidden="true" tabindex="-1"
             data-webm="../assets/video/hero-background.webm"
             data-mp4="../assets/video/hero-background.mp4"
             data-webm-small="../assets/video/hero-background-small.webm"
             data-mp4-small="../assets/video/hero-background-small.mp4"></video>
    </div>
    <header class="site-header">
      <div class="logo">My Friends <span>Pub</span> · Antalya</div>
      <div class="lang-switch lang-switch-header">
        <a href="index.html">RU</a>
        <a class="active" href="index-en.html">EN</a>
        <a href="index-tr.html">TR</a>
      </div>
    </header>

    <div class="hero-content">
      <h1>My Friends Pub</h1>
      <p class="subtitle">Live music · pub quizzes · honest craft — Antalya</p>
      <div class="hero-buttons">
        <a class="btn" href="menu-en.html">Menu</a>
        <a class="btn" href="events.html">Events</a>
        <a class="btn btn-outline" href="other-en.html">More</a>
      </div>
    </div>
  </div>

  <section class="reviews-section">
    <div class="container">
      <h2 class="reviews-title">What Our Guests Say</h2>
    </div>
    <div class="reviews-marquee">
      <div class="reviews-track" id="reviews-track"></div>
    </div>
  </section>

  <script src="../js/reviews-data.js"></script>
  <script src="../js/reviews.js"></script>
  <script src="../js/hero-video.js"></script>
</body>
</html>
