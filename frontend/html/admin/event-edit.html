<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мероприятие — Админка My Friends Pub Antalya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body>
  <div class="admin-shell">
    <nav class="admin-nav" id="admin-nav"></nav>
    <main class="admin-main">
      <a class="back-link" href="events.html">← К списку мероприятий</a>
      <h1 id="event-form-title">Мероприятие</h1>
      <p id="event-form-error" class="form-error" style="display:none;"></p>
      <form id="event-form" class="card" style="padding:20px;max-width:600px;">
        <div class="form-field"><label>Название</label><input name="title" required /></div>
        <div class="form-field"><label>Slug (латиницей, необязательно — сгенерируется сам)</label><input name="slug" /></div>
        <div class="form-field"><label>Дата</label><input type="date" name="event_date" required /></div>
        <div class="form-field"><label>Время</label><input type="time" name="event_time" required /></div>
        <div class="form-field"><label>Цена за место (₺)</label><input type="number" name="price" min="0" step="1" required /></div>
        <div class="form-field"><label>Короткое описание (для карточки)</label><textarea name="description_short" rows="2"></textarea></div>
        <div class="form-field"><label>Полное описание (для страницы мероприятия)</label><textarea name="description_long" rows="5"></textarea></div>
        <div class="form-field"><label>Путь к постеру (assets/images/...)</label><input name="poster_image" /></div>
        <div class="form-field"><label>Ссылка на видео (assets/video/... или внешняя)</label><input name="video_url" /></div>
        <button type="submit" class="btn">Сохранить</button>
      </form>
    </main>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/admin/nav.js"></script>
  <script src="../../js/admin/event-edit.js"></script>
</body>
</html>
