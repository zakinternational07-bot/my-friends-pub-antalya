<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мероприятие — Админка My Friends Pub Antalya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body>
  <div class="admin-shell">
    <nav class="admin-nav" id="admin-nav"></nav>
    <main class="admin-main">
      <a class="back-link" href="events.html">← К списку мероприятий</a>
      <h1 id="event-form-title">Мероприятие</h1>
      <p id="event-form-error" class="form-error" style="display:none;"></p>
      <form id="event-form" class="card" style="padding:20px;max-width:600px;">
        <div class="form-field"><label>Название</label><input name="title" required /></div>
        <div class="form-field"><label>Описание</label><textarea name="description" rows="5" placeholder="Что за мероприятие, для кого, что будет..."></textarea></div>

        <div class="form-field">
          <label>Фото или видео</label>
          <div id="media-preview" class="media-upload-preview"></div>
          <input type="file" id="media-input" accept="image/*,video/*" />
          <p id="media-status" style="font-size:0.85rem;color:var(--text-muted);margin-top:6px;"></p>
          <button type="button" id="media-remove-btn" class="btn btn-outline" style="display:none;margin-top:8px;">Убрать медиафайл</button>
        </div>

        <div class="form-field"><label>Дата</label><input type="date" name="event_date" required /></div>
        <div class="form-field"><label>Время</label><input type="time" name="event_time" required /></div>
        <div class="form-field"><label>Цена за место (₺)</label><input type="number" name="price" min="0" step="1" required /></div>
        <button type="submit" class="btn">Сохранить</button>
      </form>
    </main>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/admin/nav.js"></script>
  <script src="../../js/admin/event-edit.js"></script>
</body>
</html>
