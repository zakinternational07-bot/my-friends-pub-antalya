services:
  - name: my-friends-pub-antalya
    type: web
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: mfp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: console
      - key: SEAT_HOLD_MINUTES
        value: "10"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: mfp_antalya_bot
      - key: TELEGRAM_STAFF_CHAT_ID
        sync: false
      - key: REMINDER_HOURS_BEFORE
        value: "12"
      - key: REMINDER_SECOND_HOURS_BEFORE
        value: "6"
      - key: REMINDER_CANCEL_HOURS_BEFORE
        value: "3"
      - key: REMINDER_RECHECK_HOURS_BEFORE
        value: "4"
      - key: SURVEY_HOURS_AFTER_EVENT
        value: "18"
